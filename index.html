<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CD - Login</title>

    <!-- Css do Header -->
    <link rel="stylesheet" href="/components/header/header.css">

    <!-- Css do Footer -->
    <link rel="stylesheet" href="/components/footer/footer.css">

    <!-- Components JS -->
    <script src="/js/components.js" defer></script>
</head>

<body>
    <div id="header"></div>

    <main>
        <h3>Bem vindo de volta!<img class="robot" src="assets/Happy robot assistant waving hello.svg"></h3>
        <p class="logarNext">Faça login para continuar</p>

        <div class="divDadosPessoais">
            <label for="">E-mail</label>
            <div class="divInputs">
                <img width="24" height="24" src="https://img.icons8.com/material-outlined/24/5a3fbc/new-post.png"
                    alt="new-post" />
                <input type="text" placeholder="seuemail@exemplo.com">
            </div>
       

            <label for="">Senha</label>
            <div class="divInputs">
                <img width="24" height="24" src="https://img.icons8.com/material-outlined/24/5a3fbc/lock--v1.png"
                    alt="lock--v1" />
                <input class="inputSenha" type="password" placeholder="•••••••••">
            </div>
        </div>
        <p class="forgotPassword">Esqueci minha senha</p>
        <a class="btnEnviar" href="/pages/cd-usd/cd-usd.html">Enviar</a>
        <div class="divOuPai">
            <div class="divOu">OU</div>
        </div>
        <p class="account">Ainda não tem uma conta?</p>
        <a class="createAccount" href="#">Criar conta</a>
    </main>
    
    <div id="footer"></div>
</body>

</html>
